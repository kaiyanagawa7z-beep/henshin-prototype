<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>変身プロトタイプ v0.1</title>
<!--
  変身プロトタイプ v0.1（スマホ・3人称・ミラー型）
  - カメラで骨格を検出（MediaPipe Pose Landmarker）
  - 構え → 「変身！」の声 ＋ 決めポーズ → エフェクト発動
  - 声が使えない端末では「声の代わりにタップ」ボタンで代用
  ※ポーズ・エフェクト・効果音はすべて仮のオリジナル。後でオリジナルヒーロー用に差し替える
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Meiryo", sans-serif; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  video { display: none; }
  #hud { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); font-size: 12px; line-height: 1.6;
    background: rgba(0,0,0,.5); padding: 6px 10px; border-radius: 8px; white-space: pre; pointer-events: none; }
  #guide { position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); text-align: center;
    font-size: 24px; font-weight: 800; text-shadow: 0 2px 10px #000, 0 0 2px #000; pointer-events: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px;
    justify-content: center; flex-wrap: wrap; padding: 0 8px; }
  button { font-size: 14px; padding: 10px 14px; border-radius: 10px; border: none; font-weight: 700;
    background: rgba(255,255,255,.18); color: #fff; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #12141c; text-align: center; padding: 24px; }
  #start h1 { font-size: 24px; margin: 0; }
  #start p { margin: 0; opacity: .85; font-size: 14px; line-height: 1.8; }
  #btnStart { background: #ffcc00; color: #111; font-size: 17px; padding: 14px 22px; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="stage"></canvas>
<div id="hud"></div>
<div id="guide"></div>
<div id="bar">
  <button id="btnVoice">声の代わりにタップ</button>
  <button id="btnSkel">骨格表示</button>
  <button id="btnCam">カメラ切替</button>
  <button id="btnLog">ログ保存</button>
</div>
<div id="start">
  <h1>変身プロトタイプ v0.1</h1>
  <p>スマホを立てて置き、全身が映るように2〜3m離れて立ってね。<br>
     ① 胸の前で両手を合わせて「構え」<br>
     ②「変身！」と叫ぶ ＋ ③ 片手を斜め上・もう片手を腰に</p>
  <button id="btnStart">はじめる（カメラとマイクを使います）</button>
  <p id="loadMsg"></p>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===== 調整用パラメータ（実験しながらここを変える） =====
const CFG = {
  HOLD_MS: 500,           // 構えをキープする時間
  WINDOW_MS: 2500,        // 声とポーズの許容時間差（AND判定）
  READY_TIMEOUT_MS: 8000, // 構えのあと、この時間内に変身しないとリセット
  EFFECT_MS: 2600,        // 変身演出の長さ
  DONE_MS: 6000,          // 変身完了状態の長さ
  MIN_VIS: 0.5,           // 関節の信頼度のしきい値
  KEYWORDS: ["変身", "へんしん", "ヘンシン"],
  COLOR_A: [0, 220, 255],  // 仮のヒーローカラー（シアン）
  COLOR_B: [255, 200, 40], // 仮のヒーローカラー（ゴールド）
};

// ===== DOM =====
const video = document.getElementById("video");
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const guide = document.getElementById("guide");
const loadMsg = document.getElementById("loadMsg");

// ===== 状態 =====
let landmarker = null, stream = null, facingMode = "user", mirror = true;
let lm = null, lastVideoTime = -1, showSkel = true;
let state = "IDLE", stateAt = 0, guardSince = 0, voiceAt = 0, lastPoseAt = 0;
let flags = { guard: false, pose: false };
let lastTranscript = "", voiceSupported = false, rec = null, actx = null;
let particles = [], ringAt = -1, ringCenter = null, lastFrame = performance.now();
let fps = 0, fpsCount = 0, fpsAt = performance.now();
const logs = [];

function log(type, detail = "") {
  logs.push({ time: new Date().toISOString(), ms: Math.round(performance.now()), type, detail, state });
}
function setState(s) { state = s; stateAt = performance.now(); log("state", s); }

// ===== 骨格まわり =====
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const vis = (p) => p && (p.visibility ?? 1) > CFG.MIN_VIS;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// 構え：両手首が胸の前で近づいている
function isGuard(L) {
  const ls = L[11], rs = L[12], lw = L[15], rw = L[16], lh = L[23], rh = L[24];
  if (![ls, rs, lw, rw, lh, rh].every(vis)) return false;
  const sw = dist(ls, rs);
  const chestY = (ls.y + rs.y) / 2, hipY = (lh.y + rh.y) / 2, cx = (ls.x + rs.x) / 2;
  const mx = (lw.x + rw.x) / 2, my = (lw.y + rw.y) / 2;
  return dist(lw, rw) < sw * 0.6 && Math.abs(mx - cx) < sw * 0.6 &&
         my > chestY - sw * 0.1 && my < chestY + (hipY - chestY) * 0.7;
}

// 決めポーズ（仮）：片手を頭より上の斜めに、もう片手を腰に
function isHenshinPose(L) {
  const nose = L[0], ls = L[11], rs = L[12], lw = L[15], rw = L[16], lh = L[23], rh = L[24];
  if (![nose, ls, rs, lw, rw, lh, rh].every(vis)) return false;
  const sw = dist(ls, rs);
  const up = (w, sh) => w.y < nose.y && Math.abs(w.x - sh.x) > sw * 0.4;
  const atHip = (w, hip) => dist(w, hip) < sw * 0.7;
  return (up(lw, ls) && atHip(rw, rh)) || (up(rw, rs) && atHip(lw, lh));
}

// ===== 状態遷移（構え → 声＋ポーズ → 変身） =====
function update(now) {
  flags.guard = !!lm && isGuard(lm);
  flags.pose = !!lm && isHenshinPose(lm);
  if (state === "IDLE") {
    if (flags.guard) {
      if (!guardSince) guardSince = now;
      if (now - guardSince > CFG.HOLD_MS) { voiceAt = 0; lastPoseAt = 0; setState("READY"); }
    } else guardSince = 0;
  } else if (state === "READY") {
    if (flags.pose) { if (!lastPoseAt) log("pose"); lastPoseAt = now; }
    if (voiceAt && lastPoseAt && Math.abs(voiceAt - lastPoseAt) < CFG.WINDOW_MS) trigger(now);
    else if (now - stateAt > CFG.READY_TIMEOUT_MS) { log("timeout"); guardSince = 0; setState("IDLE"); }
  } else if (state === "TRANSFORM") {
    if (now - stateAt > CFG.EFFECT_MS) setState("DONE");
  } else if (state === "DONE") {
    if (now - stateAt > CFG.DONE_MS) { guardSince = 0; setState("IDLE"); }
  }
}

function onVoice(src) {
  if (state !== "READY") return;
  if (!voiceAt) log("voice", src);
  voiceAt = performance.now();
}

function bodyCenter(vw, vh) {
  if (!lm) return { x: vw / 2, y: vh / 2 };
  const ids = [11, 12, 23, 24];
  return { x: ids.reduce((s, i) => s + lm[i].x, 0) / 4 * vw, y: ids.reduce((s, i) => s + lm[i].y, 0) / 4 * vh };
}

function trigger(now) {
  setState("TRANSFORM");
  const vw = video.videoWidth, vh = video.videoHeight;
  const c = bodyCenter(vw, vh);
  ringAt = now; ringCenter = c;
  for (let i = 0; i < 180; i++) {
    const a = Math.random() * Math.PI * 2, sp = vw * (0.003 + Math.random() * 0.014);
    particles.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0,
      max: 600 + Math.random() * 900, size: vw * (0.003 + Math.random() * 0.007), gold: Math.random() < 0.4 });
  }
  playHenshinSound();
}

// ===== 効果音（WebAudioで合成したオリジナル音） =====
function playHenshinSound() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(1300, t + 0.8);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 1.2);
  const o2 = actx.createOscillator(), g2 = actx.createGain();
  o2.type = "triangle";
  o2.frequency.setValueAtTime(110, t + 0.8); o2.frequency.exponentialRampToValueAtTime(40, t + 1.7);
  g2.gain.setValueAtTime(0.0001, t + 0.8); g2.gain.exponentialRampToValueAtTime(0.5, t + 0.83); g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
  o2.connect(g2).connect(actx.destination); o2.start(t + 0.8); o2.stop(t + 2.0);
}

// ===== 描画 =====
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function drawSkeleton(P, vw) {
  ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = vw * 0.004; ctx.lineCap = "round";
  for (const [a, b] of BONES) {
    if (!vis(lm[a]) || !vis(lm[b])) continue;
    const p = P(a), q = P(b);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  ctx.fillStyle = rgba(CFG.COLOR_B, 0.95);
  for (const i of [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]) {
    if (!vis(lm[i])) continue;
    const p = P(i); ctx.beginPath(); ctx.arc(p.x, p.y, vw * 0.006, 0, Math.PI * 2); ctx.fill();
  }
}

function drawReadyAura(P, now, vw, vh) {
  const c = bodyCenter(vw, vh), pulse = 0.5 + 0.5 * Math.sin(now / 150);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = rgba(CFG.COLOR_A, 0.35 + 0.4 * pulse); ctx.lineWidth = vw * 0.008;
  ctx.beginPath(); ctx.arc(c.x, c.y, vw * (0.12 + 0.02 * pulse), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawArmorGlow(P, now, vw) {
  const p = state === "TRANSFORM" ? Math.min(1, (now - stateAt) / 1200) : 1;
  const n = Math.ceil(p * BONES.length), pulse = 0.75 + 0.25 * Math.sin(now / 200);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  for (let k = 0; k < n; k++) {
    const [a, b] = BONES[k];
    if (!vis(lm[a]) || !vis(lm[b])) continue;
    const s = P(a), e = P(b);
    for (const [w, col, al] of [[0.05, CFG.COLOR_A, 0.18], [0.022, CFG.COLOR_A, 0.45], [0.008, CFG.COLOR_B, 0.9]]) {
      ctx.strokeStyle = rgba(col, al * pulse); ctx.lineWidth = vw * w;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); ctx.stroke();
    }
  }
  ctx.restore();
  if (state === "DONE" && Math.random() < 0.4) { // 変身後のオーラの粒
    const c = bodyCenter(video.videoWidth, video.videoHeight);
    particles.push({ x: c.x + (Math.random() - 0.5) * vw * 0.2, y: c.y + vw * 0.1, vx: 0, vy: -vw * 0.003,
      life: 0, max: 900, size: vw * 0.004, gold: Math.random() < 0.5 });
  }
}

function drawEffects(now, dt, vw) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  if (ringAt >= 0) {
    const t = (now - ringAt) / 700;
    if (t < 1) {
      ctx.strokeStyle = rgba(CFG.COLOR_B, 1 - t); ctx.lineWidth = vw * 0.02 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(ringCenter.x, ringCenter.y, vw * 0.6 * t, 0, Math.PI * 2); ctx.stroke();
    } else ringAt = -1;
  }
  particles = particles.filter((q) => (q.life += dt) < q.max);
  for (const q of particles) {
    q.x += q.vx * dt / 16; q.y += q.vy * dt / 16; q.vx *= 0.985; q.vy *= 0.985;
    ctx.fillStyle = rgba(q.gold ? CFG.COLOR_B : CFG.COLOR_A, 1 - q.life / q.max);
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function draw(now, dt) {
  const cw = canvas.width, ch = canvas.height, vw = video.videoWidth, vh = video.videoHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cw, ch);
  if (!vw) return;
  const s = Math.max(cw / vw, ch / vh), dx = (cw - vw * s) / 2, dy = (ch - vh * s) / 2;
  if (mirror) ctx.setTransform(-s, 0, 0, s, cw - dx, dy); else ctx.setTransform(s, 0, 0, s, dx, dy);
  ctx.drawImage(video, 0, 0, vw, vh);
  if (lm) {
    const P = (i) => ({ x: lm[i].x * vw, y: lm[i].y * vh });
    if (showSkel) drawSkeleton(P, vw);
    if (state === "READY") drawReadyAura(P, now, vw, vh);
    if (state === "TRANSFORM" || state === "DONE") drawArmorGlow(P, now, vw);
  }
  drawEffects(now, dt, vw);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === "TRANSFORM" && now - stateAt < 350) {
    ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - (now - stateAt) / 350)})`; ctx.fillRect(0, 0, cw, ch);
  }
}

function updateText() {
  const mark = (b) => (b ? "○" : "×");
  const voiceText = voiceSupported ? (lastTranscript || "-") : "非対応（タップで代用）";
  hud.textContent = `状態: ${state}\n構え: ${mark(flags.guard)}  決めポーズ: ${mark(flags.pose)}\n声: ${voiceText}\nFPS: ${fps}`;
  if (!lm) guide.textContent = "全身が映るように立ってね";
  else if (state === "IDLE") guide.textContent = "① 胸の前で両手を合わせて構えよう";
  else if (state === "READY") guide.textContent = `「変身！」${voiceAt ? "✓" : ""} ＋ 決めポーズ${lastPoseAt ? "✓" : ""}`;
  else if (state === "TRANSFORM") guide.textContent = "";
  else if (state === "DONE") guide.textContent = "変身完了！";
}

// ===== メインループ =====
function loop() {
  const now = performance.now(), dt = Math.min(50, now - lastFrame); lastFrame = now;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    lm = res.landmarks && res.landmarks[0] ? res.landmarks[0] : null;
    fpsCount++;
  }
  if (now - fpsAt > 1000) { fps = fpsCount; fpsCount = 0; fpsAt = now; }
  update(now); draw(now, dt); updateText();
  requestAnimationFrame(loop);
}

// ===== 初期化 =====
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
}
window.addEventListener("resize", resize); resize();

async function loadModel() {
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate,
    },
    runningMode: "VIDEO", numPoses: 1,
  });
  try { return await PoseLandmarker.createFromOptions(vision, opts("GPU")); }
  catch (e) { console.warn("GPU不可、CPUで実行", e); return await PoseLandmarker.createFromOptions(vision, opts("CPU")); }
}

async function startCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream; await video.play();
  mirror = facingMode === "user";
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { voiceSupported = false; return; }
  voiceSupported = true;
  rec = new SR(); rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript; lastTranscript = t;
      if (CFG.KEYWORDS.some((k) => t.includes(k))) onVoice("speech");
    }
  };
  rec.onerror = (e) => { lastTranscript = "音声エラー: " + e.error; };
  rec.onend = () => { try { rec.start(); } catch (_) {} }; // 止まったら再開
  try { rec.start(); } catch (_) {}
}

document.getElementById("btnStart").onclick = async () => {
  loadMsg.textContent = "準備中…（初回は少し時間がかかります）";
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const [lmk] = await Promise.all([loadModel(), startCamera()]);
    landmarker = lmk;
    startVoice();
    document.getElementById("start").style.display = "none";
    log("start", navigator.userAgent);
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    loadMsg.textContent = "エラー: " + e.message + "（https か localhost で開いているか、カメラの許可を確認してね）";
  }
};
document.getElementById("btnVoice").onclick = () => onVoice("tap");
document.getElementById("btnSkel").onclick = () => { showSkel = !showSkel; };
document.getElementById("btnCam").onclick = async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  try { await startCamera(); log("camera", facingMode); } catch (e) { console.error(e); }
};
document.getElementById("btnLog").onclick = () => {
  const head = "time,ms,type,detail,state\n";
  const body = logs.map((r) => [r.time, r.ms, r.type, `"${String(r.detail).replace(/"/g, '""')}"`, r.state].join(",")).join("\n");
  const blob = new Blob(["\ufeff" + head + body], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `henshin_log_${Date.now()}.csv`; a.click();
};
</script>
</body>
</html>
